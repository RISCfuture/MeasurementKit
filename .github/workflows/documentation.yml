name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation
    # macOS, not Linux: MeasurementKitLocation, MeasurementKitUI and
    # MeasurementKitDefaults need Core Location, SwiftUI and a platform Package.swift
    # defines them on, none of which exist there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: "6.2"
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-deploy-docs-macos-latest-swift6.2-${{ hashFiles('Package.resolved') }}
      - name: Build documentation
        run: |
          swift package \
            --allow-writing-to-directory ./docs \
            generate-documentation \
            --target MeasurementKit \
            --target MeasurementKitLocation \
            --target MeasurementKitUI \
            --target MeasurementKitDefaults \
            --enable-experimental-combined-documentation \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path MeasurementKit \
            --output-path ./docs
      - name: Create root redirect
        run: |
          cat > ./docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url=/MeasurementKit/documentation/measurementkit/">
              <title>MeasurementKit Documentation</title>
              <script>
                  window.location.replace("/MeasurementKit/documentation/measurementkit/");
              </script>
          </head>
          <body>
              <p>Redirecting to <a href="/MeasurementKit/documentation/measurementkit/">MeasurementKit Documentation</a>...</p>
          </body>
          </html>
          EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
